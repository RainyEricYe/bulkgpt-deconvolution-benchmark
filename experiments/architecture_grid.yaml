  scfoundation:
    description: "scFoundation — frozen, fixed 19264 genes"
    default_config: tests/configs/scfoundation/default.yaml
    experiments:
      mean_hid128_npb2000:
        description: "Mean pool, hid 128, 2000 pseudo-bulk"
        overrides:
          model.cell_emb_style: mean
          model.deconv_hidden_dim: 128
          model.deconv_n_layers: 2
          training.n_pseudo_bulk: 2000
          training.epochs: 20
          training.lr: 0.001
          training.loss_type: mse_kl
