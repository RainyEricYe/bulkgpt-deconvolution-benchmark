  stack:
    description: "STACK — cell-embedding mixture"
    default_config: tests/configs/stack/progressive3.yaml
    experiments:
      prog3_hid512_expr:
        description: "Progressive3, hidden 512, embedding-space"
        overrides:
          model.n_progressive_layers: 3
          model.hidden_dim: 512
          training.n_pseudo_bulk: 5000
          training.epochs: 30
          training.lr: 0.00007
