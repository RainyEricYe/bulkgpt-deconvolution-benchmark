# Architecture search grid — Phase 1 + Phase 2
# Each top-level key is a method; experiments define parameter sets.
# All experiments use validation split only (sdy67, sweetwater).
# Seeds: 42, 123, 456
#
# Phase 1: coarse screen — pool/hvg/loss/frozen variants
# Phase 2: domain-shift refinement — training size, sampler, loss, domain adaptation

methods:
  scgpt:
    description: "scGPT — gene-token fine-tuning"
    default_config: tests/configs/scgpt/finetune.yaml
    experiments:
      mean_msekl_hvg581:
        description: "Mean pooling, MSE+KL, 581 HVG (best known)"
        overrides:
          model.cell_emb_style: mean
          dataset.n_hvg: 581
          training.loss_type: mse_kl
          training.lr: 0.00007
          training.backbone_lr: 0.00007
          training.unfreeze_backbone: true
          training.epochs: 30
          training.n_pseudo_bulk: 10000
      cls_msekl_hvg581:
        description: "CLS pooling, MSE+KL, 581 HVG"
        overrides:
          model.cell_emb_style: cls
          dataset.n_hvg: 581
          training.loss_type: mse_kl
          training.lr: 0.00007
          training.backbone_lr: 0.00007
          training.unfreeze_backbone: true
          training.epochs: 30
          training.n_pseudo_bulk: 10000
      attn_msekl_hvg581:
        description: "Attention pooling, MSE+KL, 581 HVG"
        overrides:
          model.cell_emb_style: attn
          dataset.n_hvg: 581
          training.loss_type: mse_kl
          training.lr: 0.00007
          training.backbone_lr: 0.00007
          training.unfreeze_backbone: true
          training.epochs: 30
          training.n_pseudo_bulk: 10000
      mean_msecos_hvg581:
        description: "Mean pooling, MSE+Cos, 581 HVG"
        overrides:
          model.cell_emb_style: mean
          dataset.n_hvg: 581
          training.loss_type: mse_cos
          training.lr: 0.00007
          training.backbone_lr: 0.00007
          training.unfreeze_backbone: true
          training.epochs: 30
          training.n_pseudo_bulk: 10000
      mean_msekl_hvg1200:
        description: "Mean pooling, MSE+KL, 1200 HVG"
        overrides:
          model.cell_emb_style: mean
          dataset.n_hvg: 1200
          training.loss_type: mse_kl
          training.lr: 0.00007
          training.backbone_lr: 0.00007
          training.unfreeze_backbone: true
          training.epochs: 30
          training.n_pseudo_bulk: 10000
      frozen_mean_msekl:
        description: "Frozen backbone, mean, MSE+KL"
        overrides:
          model.cell_emb_style: mean
          dataset.n_hvg: 581
          training.loss_type: mse_kl
          training.lr: 0.001
          training.backbone_lr: 0.0
          training.unfreeze_backbone: false
          training.epochs: 30
          training.n_pseudo_bulk: 10000

      # ── Phase 2 experiments ──────────────────────────────────────────
      mean_msekl_hvg581_npb5000:
        description: "Mean, MSE+KL, 581 HVG, 5K pseudo-bulk"
        overrides:
          model.cell_emb_style: mean
          dataset.n_hvg: 581
          training.loss_type: mse_kl
          training.lr: 0.00007
          training.backbone_lr: 0.00007
          training.unfreeze_backbone: true
          training.epochs: 30
          training.n_pseudo_bulk: 5000
      mean_msekl_hvg581_npb20000:
        description: "Mean, MSE+KL, 581 HVG, 20K pseudo-bulk"
        overrides:
          model.cell_emb_style: mean
          dataset.n_hvg: 581
          training.loss_type: mse_kl
          training.lr: 0.00007
          training.backbone_lr: 0.00007
          training.unfreeze_backbone: true
          training.epochs: 30
          training.n_pseudo_bulk: 20000

      # ── Phase 2 — Domain adaptation ────────────────────────────
      mean_msekl_hvg581_da_grl0.05:
        description: "Mean, MSE+KL, 581 HVG, GRL lambda=0.05"
        overrides:
          model.cell_emb_style: mean
          dataset.n_hvg: 581
          training.loss_type: mse_kl
          training.lr: 0.00007
          training.backbone_lr: 0.00007
          training.unfreeze_backbone: true
          training.epochs: 30
          training.n_pseudo_bulk: 10000
          training.da_method: grl
          training.da_lambda: 0.05
          training.da_grl_lambda: 1.0
      mean_msekl_hvg581_da_grl0.10:
        description: "Mean, MSE+KL, 581 HVG, GRL lambda=0.10"
        overrides:
          model.cell_emb_style: mean
          dataset.n_hvg: 581
          training.loss_type: mse_kl
          training.lr: 0.00007
          training.backbone_lr: 0.00007
          training.unfreeze_backbone: true
          training.epochs: 30
          training.n_pseudo_bulk: 10000
          training.da_method: grl
          training.da_lambda: 0.10
          training.da_grl_lambda: 1.0
      mean_msekl_hvg581_da_mmd0.05:
        description: "Mean, MSE+KL, 581 HVG, MMD lambda=0.05"
        overrides:
          model.cell_emb_style: mean
          dataset.n_hvg: 581
          training.loss_type: mse_kl
          training.lr: 0.00007
          training.backbone_lr: 0.00007
          training.unfreeze_backbone: true
          training.epochs: 30
          training.n_pseudo_bulk: 10000
          training.da_method: mmd
          training.da_lambda: 0.05
      mean_msekl_hvg581_da_entropy0.01:
        description: "Mean, MSE+KL, 581 HVG, entropy lambda=0.01"
        overrides:
          model.cell_emb_style: mean
          dataset.n_hvg: 581
          training.loss_type: mse_kl
          training.lr: 0.00007
          training.backbone_lr: 0.00007
          training.unfreeze_backbone: true
          training.epochs: 30
          training.n_pseudo_bulk: 10000
          training.da_method: entropy
          training.da_lambda: 0.01

