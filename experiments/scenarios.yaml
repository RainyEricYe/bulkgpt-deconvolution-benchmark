scenarios:
  full_benchmark:
    description: All methods x all 30 pseudo-bulk datasets
    methods:
    - '*'
    datasets:
    - '*'
    resume: true
    timeout: 7200
  foundation_models:
    description: All 5 FMs (FT+FZ) on CELLxGENE datasets
    methods:
    - scgpt-ft
    - scgpt-fz
    - geneformer-ft
    - geneformer-fz
    - scfoundation-fz
    - transcriptformer
    - stack
    datasets:
    - cellxgene/*
  ablation_scgpt:
    description: scGPT 9 variants on 3 tissues
    methods:
    - scgpt-ft
    - scgpt-fz
    - scgpt-ft-nohvg
    - scgpt-fz-nohvg
    - scgpt-continuous
    - scgpt-nokl
    - scgpt-cosloss
    - scgpt-attnpool
    - scgpt-clspool
    datasets:
    - Liver
    - Lung
    - Pancreas
    resume: true
  real_bulk:
    description: All methods on 4 real-world bulk datasets
    methods:
    - '*'
    datasets:
    - sweetwater_pbmc_gs
    - huuki_myers_dlpfc
    - demixsc_retina
    - sdy67
  sif_smoke:
    description: Quick smoke test
    methods:
    - adroit
    datasets:
    - Liver
    timeout: 300
  downstream_brca:
    description: TCGA-BRCA downstream analysis
    methods:
    - scgpt-ft
    - geneformer-ft
    - decode
    - cibersortx
    - music
    - transcriptformer
    - stack
    datasets:
    - tcga_brca
