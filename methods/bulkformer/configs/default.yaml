# BulkFormer deconvolution — default training configuration
backbone: bulkformer
embed_dim: 640

# Data
sc_ref: data/1_pseudo_bulk/Liver.h5ad
celltype_col: cell_type
n_hvg: 3000
min_cells_per_type: 20

# Pseudo-bulk generation
n_pseudo_bulk: 5000
min_cell_types_per_sample: 2
max_cell_types_per_sample: 5
cells_per_sample_min: 10
cells_per_sample_max: 100
dirichlet_alpha: 1.0

# Model
hidden_dims: [256]
dropout: 0.1

# Training
batch_size: 64
epochs: 30
lr: 1.0e-3
weight_decay: 1.0e-5
step_size: 10
step_gamma: 0.9
seed: 42

# Output
checkpoint_dir: checkpoints/bulkformer/default
log_interval: 10
