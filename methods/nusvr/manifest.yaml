name: NuSVR
mode: conda
conda_env: bulkgpt
timeout: 600
entry:
  run: methods/nusvr/run.py
test_configs:
  default: tests/configs/nusvr/default.yaml
description: >
  Nu-support vector regression deconvolution.
  Builds a signature matrix from scRNA-seq reference and solves
  for proportions using NuSVR with a linear kernel.
