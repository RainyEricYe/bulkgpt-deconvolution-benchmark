# Geneformer — fine-tune backbone, 5000 pseudo-bulk, 80/20 split
dataset:
  data_path: tests/data/sdy67.h5
  n_hvg: 200
  celltype_col: cell_type
  batch_col:
model:
  deconv_hidden_dim: 128
  deconv_n_layers: 2
  deconv_dropout: 0.1
  cell_emb_style: cls
  max_seq_len: 2048
training:
  seed: 42
  epochs: 30
  batch_size: 8
  lr: 0.001
  backbone_lr: 0.00007
  unfreeze_backbone: true
  loss_type: mse_kl
  num_workers: 1
  train_ratio: 0.8
  val_ratio: 0.2
  n_pseudo_bulk: 5000
paths:
  gene_cache: weights/transcriptformer/tf_sapiens/gene_cache/gene_mapping_cache.json
  pretrained_model: weights/geneformer/default
  checkpoint_dir: tests/output/geneformer/finetune_pb5k
