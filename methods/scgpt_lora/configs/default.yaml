# scGPT-LoRA fine-tuning (default config)
description: "LoRA r=8, q/v only, lr=1e-3 (recommended default)"
model_dir: weights/scgpt/whole-human
device: cuda
seed: 42
batch_size: 32
max_length: 1200
n_epochs: 100
lr: 0.001
weight_decay: 0.0001
patience: 15
peft_config:
  LoRA_FLAG: true
  r: 8
  lora_alpha: 1
  enable_lora: [true, false, true]
  adapter_layer_conf: [true, true, true, true, true, true, true, true, true, true, true, true]
  ENCODER_FLAG: false
  TOKEN_FLAG: false
  PREFIX_FLAG: false
# Runtime keys (populated by dispatcher)
h5_path: ~
gt_path: ~
output_dir: ~
results_dir: ~
dataset: {}
data: {}
paths: {}
training:
  n_pseudo_bulk: 5000
  epochs: 30
